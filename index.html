const names=["Fajr","Shuruq","Dhuhr","Asr","Maghrib","Isha"];

function toMin(t){const[h,m]=t.split(":").map(Number);return h*60+m;}

function update(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,"0");
  const todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const months=["January","February","March","April","May","June","July","August","September","October","November","December"];
  document.getElementById("today-date").textContent=`${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

  const d=data[todayKey];
  if(!d){
    document.getElementById("prayer-list").innerHTML=`<div class="no-data">No data for today</div>`;
    document.getElementById("next-name").textContent="--";
    document.getElementById("next-time").textContent="--:--";
    return;
  }

  document.getElementById("hijri-date").textContent=d[6];

  const nowMin=now.getHours()*60+now.getMinutes();
  let nextIdx=-1;
  for(let i=0;i<6;i++){
    if(toMin(d[i])>nowMin){nextIdx=i;break;}
  }

  if(nextIdx>=0){
    document.getElementById("next-name").textContent=names[nextIdx];
    document.getElementById("next-time").textContent=d[nextIdx];
    const diff=toMin(d[nextIdx])-nowMin;
    const h=Math.floor(diff/60);
    const m=diff%60;
    document.getElementById("countdown").textContent=`in ${h>0?h+"h ":""}${m}min`;
  } else {
    document.getElementById("next-name").textContent="Fajr";
    document.getElementById("next-time").textContent="Tomorrow";
    document.getElementById("countdown").textContent="All prayers done for today";
  }

  const html=names.map((name,i)=>{
    const t=toMin(d[i]);
    const cls=i===nextIdx?"active":t<nowMin?"passed":"";
    return `<div class="prayer-row ${cls}">
      <span class="prayer-name">${name}</span>
      <span class="prayer-time">${d[i]}</span>
    </div>`;
  }).join("");
  document.getElementById("prayer-list").innerHTML=html;
}

update();
setInterval(update,30000);
</script>
